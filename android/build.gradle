// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK r27 builds 16 KB page size compatible libraries with the flags React Native passes.
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        kotlin_version = kotlinVersion

        // Read by react-native-push-notification
        googlePlayServicesVersion = "16.+"
        googlePlayServicesIidVersion = "16.0.1"
        firebaseVersion = "17.3.4"
        firebaseMessagingVersion = "21.1.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/detox/Detox-android")
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                // Old native modules ask for SDK levels and build tools that are no longer installed.
                buildToolsVersion rootProject.ext.buildToolsVersion
                compileSdkVersion rootProject.ext.compileSdkVersion
                // A module that names no NDK would otherwise use the Android Gradle Plugin's default one.
                ndkVersion rootProject.ext.ndkVersion
                defaultConfig {
                    minSdkVersion rootProject.ext.minSdkVersion
                    // 16 KB page size: NDK r27 links 4 KB aligned libraries unless asked (realm does not ask).
                    externalNativeBuild {
                        cmake {
                            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                        }
                    }
                }
            }
        }
    }
}

subprojects { subproject ->
    if (project['name'] == 'react-native-widget-center') {
        project.configurations { compile { } }
    }
}

apply plugin: "com.facebook.react.rootproject"
