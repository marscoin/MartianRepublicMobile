apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to create four separate APKs instead of one,
 * one for each native architecture. This is useful if you don't
 * use App Bundles (https://developer.android.com/guide/app-bundle/)
 * and want to have separate APKs to upload to the Play Store.
 */
def enableSeparateBuildPerCPUArchitecture = false


/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'io.github.react-native-community:jsc-android-intl:2026004.+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android-intl:2026004.+'

// Supply these through the process environment or ~/.gradle/gradle.properties.
// Never commit upload keys or passwords to this repository.
def uploadSigning = [:]
['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].each { name ->
    def setting = "MARS_UPLOAD_${name}"
    uploadSigning[name] = System.getenv(setting) ?: project.findProperty(setting)
}
def hasUploadSigning = uploadSigning.values().every { it }

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.martianrepublic.app"
    defaultConfig {
        // The Play listing and the iOS app use org.martianrepublic. The Java package (namespace) keeps its old name.
        applicationId "org.martianrepublic"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (System.getenv('MARS_VERSION_CODE') ?: '18').toInteger()
        versionName "1.0.13"
        // Filter prebuilt native libraries to the same ABIs as source-built modules.
        // Otherwise an ARM-only build advertises incomplete x86/32-bit support.
        ndk {
            abiFilters.addAll((project.findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(','))
        }
        testBuildType System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile file(uploadSigning.STORE_FILE)
                storePassword uploadSigning.STORE_PASSWORD
                keyAlias uploadSigning.KEY_ALIAS
                keyPassword uploadSigning.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadSigning) signingConfig signingConfigs.release
            //minifyEnabled enableProguardInReleaseBuilds
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            proguardFile "${rootProject.projectDir}/../node_modules/detox/android/detox/proguard-rules-app.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    androidTestImplementation('com.wix:detox:+')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "androidx.core:core-splashscreen:1.0.1"
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
apply plugin: 'com.google.gms.google-services'  // Google Services plugin
